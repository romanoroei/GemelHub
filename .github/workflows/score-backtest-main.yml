name: GemelHub Score Backtest Temporary

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - '.github/workflows/score-backtest-main.yml'

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/gemelhub-score-backtest
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run corrected grid backtest
        run: node scripts/score-backtest.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: gemelhub-score-grid-results
          path: backtest-results/
