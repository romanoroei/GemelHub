name: GemelHub Score Backtest
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run backtest
        run: node scripts/score-backtest.mjs
      - name: Commit results to analysis branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backtest-results/score-backtest.json
          git commit -m "Run GemelHub score backtest" || exit 0
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: gemelhub-score-backtest
          path: backtest-results/score-backtest.json
