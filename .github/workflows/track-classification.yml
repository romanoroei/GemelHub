name: Track classification checks
on:
  push:
    branches: [safe-track-classification-audit, main]
    paths: ['js/config.js', 'js/api.js', 'js/app.js', 'fund.html', 'scripts/track-classification.test.mjs', '.github/workflows/track-classification.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/track-classification.test.mjs
      - run: node scripts/custom-range.test.mjs
