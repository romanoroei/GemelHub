name: Track classification data audit
on:
  push:
    branches: [safe-track-classification-audit]
    paths: ['scripts/track-data-audit.mjs','.github/workflows/track-data-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/track-data-audit.mjs
        env:
          BASELINE_SHA: e652fdf3de002d5dfeabc1c0abb819435ad68345
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: track-audit-report
          path: track-audit-report.json
